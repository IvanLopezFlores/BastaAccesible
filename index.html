<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Basta Accesible</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Juego "Basta" Accesible</h1>
        
        <p id="instruction">Instrucción: <span id="letter">-</span></p>
        
        <p>Tiempo restante: <span id="timer">10</span> segundos</p>

        <button onclick="startGame()">Iniciar juego</button>
        <button onclick="pauseGame()">Pausar</button>
        <button onclick="resumeGame()">Reanudar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
